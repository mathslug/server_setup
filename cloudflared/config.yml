# cloudflared ingress for the Pi.
#
# Installed to /etc/cloudflared/config.yml. One tunnel serves every app;
# routing is by hostname, so adding an app means adding an ingress rule here
# and running:
#
#     sudo cloudflared tunnel route dns mypi <hostname>
#
# The tunnel dials OUT to Cloudflare, so nothing is exposed on the LAN, no
# router ports are forwarded, and the dynamic residential IP is irrelevant.
#
# The UUID is an identifier, not a secret. The secret is the credentials file
# it names, which stays on the Pi and is never committed.

tunnel: 462d4ad3-6905-48f3-9ed5-0d9a20c3b550
credentials-file: /etc/cloudflared/462d4ad3-6905-48f3-9ed5-0d9a20c3b550.json

# Survive brief wifi drops without tearing down the tunnel.
retries: 10
grace-period: 30s

# Metrics for the monitoring step; loopback only.
metrics: 127.0.0.1:60123

ingress:
  # whorl — rootless podman container, published on the host's loopback.
  - hostname: whorl.mathslug.com
    service: http://127.0.0.1:3000
    originRequest:
      # The app sets its own timeouts; these just stop a hung origin from
      # pinning a tunnel connection open indefinitely.
      connectTimeout: 10s
      noHappyEyeballs: true

  # karb — not migrated yet.
  # - hostname: karb.mathslug.com
  #   service: http://127.0.0.1:8000

  # AvaLong — not migrated yet.
  # - hostname: avalong.mathslug.com
  #   service: http://127.0.0.1:5000

  # Required catch-all. Anything not matched above gets a 404 rather than
  # being silently proxied somewhere unintended.
  - service: http_status:404
