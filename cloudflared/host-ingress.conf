# Tunnel ingress for services on the Pi ITSELF, as opposed to deployed apps.
#
# Apps get their ingress generated from apps/*.conf, keyed on HOSTNAME and
# LOCAL_PORT. These are the things that have no app conf because they are not
# apps: the health dashboard, and SSH to the box.
#
# Format: one "hostname|service" per line. The service is a cloudflared origin
# URL, so it carries the protocol — http:// for a web service, ssh:// for SSH,
# which is what lets a single tunnel carry both.
#
# ─────────────────────────────────────────────────────────────────────────────
# EVERYTHING LISTED HERE IS REACHABLE FROM THE PUBLIC INTERNET once its DNS
# record exists. Neither of these authenticates on its own — the dashboard has
# no login at all — so both are gated by Cloudflare Access policies, and the
# ONLY thing standing between the dashboard and the world is that policy.
#
# So the order matters, and it is the opposite of the tempting one:
#
#   1. Create the Access application and policy for the hostname
#   2. Add it here and render
#   3. Create the DNS record LAST
#
# Adding a line here is inert until DNS exists, which is what makes that order
# safe. Creating DNS first would publish an unauthenticated health dashboard
# for however long it took to notice.
# ─────────────────────────────────────────────────────────────────────────────

HOST_INGRESS=(
  # Health dashboard — busybox httpd in the `dashboard` container. Still bound
  # to the LAN on :8080 as well, so at home it is reachable without a round
  # trip through Cloudflare.
  "mypi.mathslug.com|http://127.0.0.1:8080"

  # SSH. Reached with `cloudflared access ssh` as a ProxyCommand; see the Host
  # block this repo installs in ~/.ssh/config on the Mac.
  #
  # Worth being clear that this is defence in depth rather than the only lock:
  # sshd still requires a key, exactly as it did when the droplet had a public
  # IP. Access adds an identity check in front of that.
  "ssh.mathslug.com|ssh://localhost:22"
)
