# jep — Final Jeopardy wagering practice.
# A static site: busybox httpd serving four files. No database, no secrets.

# HTTPS, not git@: the repo is public, so the Pi needs no credential.
REPO="https://github.com/mathslug/jep.git"
BRANCH="main"

QUADLET="deploy/jep.container"
IMAGE="jep"
SERVICE="jep"

DATA_SUBDIR="jep"

HOSTNAME="jep.mathslug.com"
LOCAL_PORT=8004
HEALTH_PATH="/healthz"

# Public as it stands, so the Pi creates the DNS record itself.
DNS="auto"

# No database and no uploads: there is nothing to snapshot.
BACKUP_DB=""
BACKUP_DIRS=""

ENV_TEMPLATE=""
