# whorl — https://whorl.mathslug.com
# Node + Express + SQLite (node:sqlite, WAL) + sharp.

REPO="git@github.com:mathslug/secretBlog.git"
BRANCH="main"

# Quadlet unit, relative to the repo root. Installed to
# ~/.config/containers/systemd/ and turned into a service by systemd's
# podman-user-generator.
QUADLET="deploy/whorl.container"

IMAGE="whorl"
SERVICE="whorl"

# Bind-mounted to DATA_DIR in the container: app.db + images/.
# Never touched by a deploy; this is the only state that matters.
DATA_SUBDIR="whorl"

HEALTH_URL="http://127.0.0.1:3000/healthz"

# Written to ~/.config/whorl.env on first deploy if absent, then left alone.
# Real values go in by hand — this file is in git, that one is not.
ENV_TEMPLATE="DOMAIN=whorl.mathslug.com
APP_TZ=America/New_York"
