# avalong — Avalon, played over days with friends.
# Python 3.12 + Flask + gunicorn. No database, no secrets, no cron.

REPO="https://github.com/mathslug/AvaLong.git"
BRANCH="main"

QUADLET="deploy/avalong.container"
IMAGE="avalong"
SERVICE="avalong"

DATA_SUBDIR="avalong"

HOSTNAME="avalong.mathslug.com"
LOCAL_PORT=8001
HEALTH_PATH="/healthz"

# No database: state is in-memory only, so there's nothing to snapshot.
BACKUP_DB=""
BACKUP_SNAPSHOT_CMD=""
BACKUP_DIRS=""

ENV_TEMPLATE=""
