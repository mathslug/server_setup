# vikunja — tasks: inbox, projects, labels, defer and due dates.
# The published image, run as is: Go binary + SQLite. No repo of ours; the unit
# beside this file pins the version.
#
# Public surface: /health only. Two Cloudflare Access applications: one for the
# whole hostname (owner's email), and a Bypass for /health so the collector can
# reach it. Vikunja's own login sits behind Access; registration is off.

REPO=""

QUADLET="apps/vikunja.container"
SERVICE="vikunja"
DATA_SUBDIR="vikunja"

HOSTNAME="tasks.mathslug.com"
LOCAL_PORT=8003
# Pings the database and returns OK. /api/v1/info would also do, but it tells
# the internet the version and which features are on.
HEALTH_PATH="/health"

BACKUP_DB="vikunja.db"
# Attachments and project backgrounds; everything else is in SQLite.
BACKUP_DIRS="files"

# Settings are Environment= lines in the unit, in git. Only the secret is here.
#
# VIKUNJA_SERVICE_SECRET  signs sessions; changing it logs everyone out. Left
#                         unset, Vikunja makes a new one on every start, so
#                         every deploy logs you out. `openssl rand -hex 32`.
ENV_TEMPLATE="VIKUNJA_SERVICE_SECRET="
