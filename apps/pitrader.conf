# pitrader — CEF/Treasury paper trader and Kalshi gas/rain archive + shadow scorer.
# Python 3.13 + Flask (read-only dashboard) + SQLite (WAL); jobs run as
# short-lived containers from the same image.
#
# Public surface: /healthz only. Two Cloudflare Access applications: one for
# the whole hostname (owner's email), and a Bypass for /healthz so the collector
# can reach it. The app re-checks every other request by verifying the Access
# JWT itself, failing closed.

REPO="git@github.com:mathslug/pitrader.git"
BRANCH="main"

QUADLET="deploy/pitrader.container"
UNITS_DIR="deploy/units"
IMAGE="pitrader"
SERVICE="pitrader"
DATA_SUBDIR="pitrader"

HOSTNAME="pitrader.mathslug.com"
LOCAL_PORT=8002
HEALTH_PATH="/healthz"

# daily      every NYSE session morning; longest gap Fri -> Mon plus a holiday
# gas-archive every 15 minutes, every day
JOB_RECEIPTS="daily:100h gas-archive:1h"

BACKUP_DB="pitrader.db"
BACKUP_DIRS=""

# PITRADER_ACCESS_*    Cloudflare Access team + the pitrader app's AUD tag
# PITRADER_ACCOUNT     ledger account name (default paper)
# PITRADER_BROKER      paper (fills simulated at the close) | schwab
# PITRADER_CAPITAL     opening paper balance
# PITRADER_TSY_MODE    futures (manual ZN alerts) | tlt | off
# SMTP_* / NOTIFY_EMAIL  morning order emails (optional)
# SCHWAB_*             live trading only; see src/pitrader/brokers/schwab.py
ENV_TEMPLATE="PITRADER_ACCESS_TEAM=mathslug.cloudflareaccess.com
PITRADER_ACCESS_AUD=
PITRADER_ACCOUNT=paper
PITRADER_BROKER=paper
PITRADER_CAPITAL=500000
PITRADER_TSY_MODE=futures
SMTP_USER=
SMTP_PASSWORD=
NOTIFY_EMAIL=
SCHWAB_API_KEY=
SCHWAB_APP_SECRET=
SCHWAB_CALLBACK_URL=https://127.0.0.1:8182
SCHWAB_ACCOUNT_NUMBER=
PITRADER_LIVE_DRY_RUN=1"
