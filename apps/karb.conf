# karb — Kalshi cross-market arbitrage scanner.
# Python 3.13 + Flask + gunicorn + SQLite (WAL), Anthropic for LLM screening.
#
# This file is the single source of truth for the app. Deploys, auto-deploy,
# backups, the health dashboard and the cloudflared ingress all read it — so
# adding an app means writing one of these, not editing five scripts.

# HTTPS, not git@: the repo is public, so the Pi needs no credential. If it is
# ever made private, change this to the git@github.com: form and deploy-app.sh
# will generate and print a deploy key on the next run.
REPO="https://github.com/mathslug/Karb_Scanner.git"
BRANCH="main"

# Quadlet unit, relative to the repo root. Installed to
# ~/.config/containers/systemd/ and turned into a service by systemd's
# podman-user-generator. This is the web UI only.
QUADLET="deploy/karb.container"

# Plain systemd user units installed alongside it, and any .timer among them
# enabled: four timers driving one templated job unit.
UNITS_DIR="deploy/units"

IMAGE="karb"
SERVICE="karb"

# Bind-mounted into the container. Never touched by a deploy; this is the only
# state that matters, and the only thing the backup cannot regenerate.
DATA_SUBDIR="karb"

# Public hostname and the loopback port the container publishes on. Together
# these generate the cloudflared ingress rule and the DNS route.
HOSTNAME="karb.mathslug.com"
LOCAL_PORT=8000
HEALTH_PATH="/healthz"

# --- Scheduled jobs --------------------------------------------------------
# What the dashboard watches beyond "is the web app serving", and how long each
# job may go without a clean run before it says something. Serving and working
# are different questions: a revoked API key stops the scan while karb.service
# stays active, /healthz stays 200 and the site serves stale data perfectly.
#
# Each threshold is the longest gap between runs, plus slack:
#   sports  daily 07:35 UTC          -> 24h between runs
#   daily   daily 08:00 UTC          -> 24h
#   sweep   15:00 and 20:00 UTC      -> 19h is the long gap
#   hot     hourly at :30            -> 1h
JOB_RECEIPTS="sports:26h daily:26h sweep:21h hot:3h"

# --- Backup ----------------------------------------------------------------
# The database inside DATA_DIR, and the command that writes a consistent
# snapshot of it to /data/.backup.db from inside the container. Per-app because
# the snapshot has to run in the app's own runtime — whorl's is node.
BACKUP_DB="slonk_arb.db"
BACKUP_SNAPSHOT_CMD="python /app/snapshot.py"
# Extra directories under DATA_DIR to copy verbatim. karb keeps everything in
# SQLite, so there are none.
BACKUP_DIRS=""

# Written to ~/.config/karb.env on first deploy if absent, then left alone.
# Real values go in by hand — this file is in git, that one is not.
#
# ANTHROPIC_API_KEY      LLM screening in scan.py
# SLONK_ADMIN_PASSWORD   HTTP basic auth on the write routes; empty = no admin
# FLASK_SECRET_KEY       session signing; regenerating it logs everyone out
# SMTP_*, NOTIFY_EMAIL   Gmail SMTP for BUY alerts (notify.py)
#
# DIGITALOCEAN_TOKEN is deliberately absent: gpu_droplet.py can spin up a
# $1.99/hr GPU droplet, and without the token it cannot.
ENV_TEMPLATE="ANTHROPIC_API_KEY=
SLONK_ADMIN_PASSWORD=
FLASK_SECRET_KEY=
SMTP_USER=
SMTP_PASSWORD=
NOTIFY_EMAIL="
